# Keeps the pinned actions (the comment after each sha says the version) and the npm packages current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # Astro, Pagefind and the test tools: CI builds and runs every test on each update
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
